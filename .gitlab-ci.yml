include:
  - project: "waldur/waldur-pipelines"
    file: "/templates/utils/release-utils.yml"

stages:
  - test
  - release

# Both the toolchain and the generator are pinned on purpose. `golang:tip` is
# Go's development trunk and `oapi-codegen@latest` floats, so a nightly
# regeneration could change the published SDK with nothing recording which
# versions produced it — and a broken build left two moving suspects and no
# version to bisect against. Bump these deliberately, in their own MR, so the
# resulting client.go diff is reviewable.
variables:
  GO_IMAGE: registry.hpc.ut.ee/mirror/library/golang:1.26-alpine
  # Keep in sync with the "Code generated by ... version vX.Y.Z" header that
  # oapi-codegen writes at the top of client.go.
  OAPI_CODEGEN_VERSION: v2.8.0

Fetch OpenAPI schema:
  extends: .fetch-openapi-schema

Build Go SDK:
  stage: test
  image: $GO_IMAGE
  rules:
    - if: '$CI_PIPELINE_SOURCE == "pipeline"'
    - if: '$CI_PIPELINE_SOURCE == "trigger"'
    - if: '$CI_PIPELINE_SOURCE == "web"'
  needs:
    - job: Fetch OpenAPI schema
      artifacts: true
  before_script:
    - apk add --no-cache git
  script:
    - set -e
    # waldur-openapi-schema.yaml is downloaded automatically from needs
    - go install github.com/oapi-codegen/oapi-codegen/v2/cmd/oapi-codegen@${OAPI_CODEGEN_VERSION}
    - oapi-codegen --package client --generate types,client -o client.go waldur-openapi-schema.yaml
    - echo "Compiling Go module..."
    - go build -v ./...
  artifacts:
    paths:
      - client.go
    expire_in: 1 day

Release Go SDK:
  stage: release
  image: $GO_IMAGE
  rules:
    - if: '$CI_PIPELINE_SOURCE == "pipeline"'
    - if: '$CI_PIPELINE_SOURCE == "trigger"'
    - if: '$CI_PIPELINE_SOURCE == "web"'
  needs:
    - job: Build Go SDK
      artifacts: true
  before_script:
    - apk add --no-cache git
    - git config --global user.name "$GITLAB_USER_NAME"
    - git config --global user.email "$GITLAB_USER_EMAIL"
    # Authenticate origin with token for pushing back commits & tags
    - git remote set-url origin "https://gitlab-ci-token:${GITLAB_TOKEN}@${CI_SERVER_HOST}/${CI_PROJECT_PATH}.git"
  script:
    # client.go is passed from the Test Go SDK job automatically
    - |
      if [ -n "$RELEASE_VERSION" ]; then
        git add client.go
        git diff --cached --quiet && echo "No changes" || git commit -m "Release: update code to $RELEASE_VERSION"
        git tag -a $RELEASE_VERSION -m "Release version $RELEASE_VERSION" || echo "Tag $RELEASE_VERSION already exists"
        git push origin $RELEASE_VERSION || echo "Tag $RELEASE_VERSION already pushed"
      else
        git add client.go
        git diff --cached --quiet && echo "No changes" || git commit -m "chore: nightly update of Waldur Go SDK"
      fi
    - git push origin HEAD:main || echo "main already up to date in go-client"
